# Versions. Any of them can be overridden with -P<name>=<value>.

# Must match the server's Typewriter version exactly (`/typewriter about`),
# otherwise the extension is not loaded.
typewriter.engineVersion=0.9.0-beta-177

# 4.1.3 or newer: setExternallyDriven, focusLocation, per-page exit/skip rules.
luxdialogues.apiVersion=4.1.3

citizens.version=2.0.41-SNAPSHOT

extension.version=1.4.0

# Optional: `./gradlew buildAndMove` copies the jar into this folder.
# server.path=../server/plugins/Typewriter/extensions

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
kotlin.daemon.jvmargs=-Xmx2G
